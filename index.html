<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BoH Reporting Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Disable zooming on double tap for tactile inputs */
        button { touch-action: manipulation; }
        /* Style the select dropdown */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-10">

    <div class="sticky top-0 bg-gray-800 border-b border-gray-700 shadow-lg p-4 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-xs uppercase tracking-widest text-gray-400">System Total</h1>
            <div class="text-3xl font-bold text-emerald-400">$<span id="grand-total">0.00</span></div>
        </div>
        
        <div class="relative">
            <select id="manager-id" class="bg-gray-900 border border-gray-600 text-white p-2 pr-8 rounded w-40 focus:outline-none focus:border-emerald-500 font-bold">
                <option value="" disabled selected>Loading...</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
        </div>
    </div>

    <div class="p-4 space-y-6 max-w-md mx-auto mt-4">
        
        <div class="bg-gray-800 p-4 rounded-lg shadow border border-emerald-900">
            <h2 class="text-lg text-emerald-500 font-bold mb-4 uppercase tracking-wider border-b border-emerald-900 pb-2">Paper Currency</h2>
            <div id="bills-container" class="space-y-3"></div>
        </div>

        <div class="bg-gray-800 p-4 rounded-lg shadow border border-gray-700">
            <h2 class="text-lg text-gray-400 font-bold mb-4 uppercase tracking-wider border-b border-gray-700 pb-2">Rolled Alloys</h2>
            <div id="coins-container" class="space-y-3"></div>
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-lg shadow-lg uppercase tracking-widest transition-colors">
            Transmit Count
        </button>
        
        <div id="status-message" class="text-center text-sm hidden"></div>
    </div>

    <script>
        // System Config
        const API_URL = "https://script.google.com/macros/s/AKfycby39QuKEbxXJhA_hGbk7O3bVl2y1-15nnOacKQh5aV7bNMTWz_CQuNa6WMmSAFTvbs_/exec";

        const denominations = {
            bills: [
                {id: 'hundreds', val: 100, label: '$100'}, {id: 'fifties', val: 50, label: '$50'}, 
                {id: 'twenties', val: 20, label: '$20'}, {id: 'tens', val: 10, label: '$10'}, 
                {id: 'fives', val: 5, label: '$5'}, {id: 'ones', val: 1, label: '$1'}
            ],
            coins: [
                {id: 'quarters', val: 10, label: '$10 Quarters'}, {id: 'dimes', val: 5, label: '$5 Dimes'}, 
                {id: 'nickels', val: 2, label: '$2 Nickels'}, {id: 'pennies', val: 0.5, label: '50¢ Pennies'}
            ]
        };

        let counts = { hundreds: 0, fifties: 0, twenties: 0, tens: 0, fives: 0, ones: 0, quarters: 0, dimes: 0, nickels: 0, pennies: 0 };

        // Initialization Sequence: Fetch personnel list from the Construct
        window.addEventListener('DOMContentLoaded', async () => {
            await bootSequence();
        });

        async function bootSequence() {
            const managerSelect = document.getElementById('manager-id');
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.status === "success") {
                    managerSelect.innerHTML = '<option value="" disabled selected>Select Mgr</option>';
                    result.managers.forEach(mgr => {
                        const opt = document.createElement('option');
                        opt.value = mgr;
                        opt.innerText = mgr;
                        managerSelect.appendChild(opt);
                    });
                } else {
                    managerSelect.innerHTML = '<option value="" disabled>Auth Error</option>';
                }
            } catch (error) {
                managerSelect.innerHTML = '<option value="" disabled>Network Offline</option>';
            }
        }

        // Render UI Elements
        function generateRow(item, colorScheme) {
            const btnClass = `w-12 h-12 bg-${colorScheme}-700 rounded active:bg-${colorScheme}-500 text-xl font-bold flex items-center justify-center shadow`;
            return `
                <div class="flex items-center justify-between bg-gray-900 p-2 rounded">
                    <div class="w-24 font-mono text-sm text-${colorScheme}-400">${item.label}</div>
                    <div class="flex items-center space-x-4">
                        <button onclick="updateCount('${item.id}', -1)" class="${btnClass}">-</button>
                        <div id="count-${item.id}" class="w-8 text-center text-xl font-bold">0</div>
                        <button onclick="updateCount('${item.id}', 1)" class="${btnClass}">+</button>
                    </div>
                </div>`;
        }

        document.getElementById('bills-container').innerHTML = denominations.bills.map(b => generateRow(b, 'emerald')).join('');
        document.getElementById('coins-container').innerHTML = denominations.coins.map(c => generateRow(c, 'gray')).join('');

        // Logic processing
        function updateCount(id, delta) {
            if (counts[id] + delta >= 0) {
                counts[id] += delta;
                document.getElementById(`count-${id}`).innerText = counts[id];
                updateTotal();
            }
        }

        function updateTotal() {
            let total = 0;
            denominations.bills.forEach(b => total += counts[b.id] * b.val);
            denominations.coins.forEach(c => total += counts[c.id] * c.val);
            document.getElementById('grand-total').innerText = total.toFixed(2);
            return total;
        }

        async function transmitData() {
            const manager = document.getElementById('manager-id').value;
            if (!manager) { alert("ERROR: Identity not authenticated. Please select a Manager."); return; }

            const btn = document.getElementById('transmit-btn');
            const status = document.getElementById('status-message');
            
            btn.innerText = "Transmitting...";
            btn.disabled = true;

            const total = updateTotal();
            
            // Capture the exact localized time of the action
            const actionTime = new Date().toLocaleString();
            
            const breakdownData = {
                hundreds: counts.hundreds * 100, fifties: counts.fifties * 50, twenties: counts.twenties * 20,
                tens: counts.tens * 10, fives: counts.fives * 5, ones: counts.ones * 1,
                quarters: counts.quarters * 10, dimes: counts.dimes * 5, nickels: counts.nickels * 2, pennies: counts.pennies * 0.5
            };

            const payload = { 
                manager: manager, 
                timestamp: actionTime,
                total: total, 
                breakdown: breakdownData 
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    status.innerText = `Transmission successful. Variance: $${result.variance.toFixed(2)}`;
                    status.className = "text-center text-sm mt-4 text-emerald-400 block font-bold tracking-wider";
                    btn.innerText = "Count Logged";
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                status.innerText = "Transmission failed. Check network connection.";
                status.className = "text-center text-sm mt-4 text-red-500 block font-bold tracking-wider";
                btn.innerText = "Retry Transmission";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
